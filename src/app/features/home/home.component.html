<ion-header class="ion-no-border">
  <ion-toolbar class="px-2 !pt-1">
    <div class="pl-0 mr-2">
      <div class="flex items-center gap-2.5 bg-white py-[5px] pr-3.5 pl-[5px] rounded-[26px] shadow-sm">
        <ion-avatar class="w-9 h-9 bg-blue-500/10 flex items-center justify-center">
          <img [src]="userAvatar()" alt="avatar" />
        </ion-avatar>
        <div class="flex flex-col">
          <span class="text-sm font-semibold text-slate-800">{{ userName() }}</span>
          <span class="text-[11px] text-slate-400">Personal account</span>
        </div>
      </div>
    </div>
    <ion-buttons slot="end">
      <ion-button fill="solid" class="header-btn w-[42px]! h-[42px]! rounded-full! shadow-md" (click)="onLogout()">
        <ion-icon slot="icon-only" name="log-out-outline" class="!text-lg"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="mb-5" [@fadeIn]="loaded()">
    <div class="flex items-center bg-white rounded-2xl px-4 py-1 shadow-sm">
      <ion-icon name="search-outline" class="text-xl mr-3 text-slate-300"></ion-icon>
      <ion-input placeholder="Search..." class="flex-1"></ion-input>
    </div>
  </div>

  <div class="flex gap-4 mb-6" [@fadeIn]="loaded()">
    <ion-card 
      class="flex-1 m-0 rounded-2xl" 
      [class.pressed]="pressedCard() === 'left'"
      (pointerdown)="pressedCard.set('left')"
      (pointerup)="onCardClick(dataService.leftSliderValue()); pressedCard.set(null)"
      (pointerleave)="pressedCard.set(null)"
      button
    >
      <ion-card-content>
        <div class="flex flex-col items-center">
          <span class="text-xs mb-1.5 opacity-60">Lorem</span>
          <span class="text-2xl font-bold" [appCountUp]="dataService.leftSliderValue()"></span>
        </div>
      </ion-card-content>
    </ion-card>

    <ion-card 
      class="flex-1 m-0 rounded-2xl" 
      [class.pressed]="pressedCard() === 'right'"
      (pointerdown)="pressedCard.set('right')"
      (pointerup)="onCardClick(dataService.rightSliderValue()); pressedCard.set(null)"
      (pointerleave)="pressedCard.set(null)"
      button
    >
      <ion-card-content>
        <div class="flex flex-col items-center">
          <span class="text-xs mb-1.5 opacity-60">Ipsum</span>
          <span class="text-2xl font-bold" [appCountUp]="dataService.rightSliderValue()"></span>
        </div>
      </ion-card-content>
    </ion-card>
  </div>

  <ion-card class="m-0 mb-6" [@fadeIn]="loaded()">
    <ion-card-content>
      <div class="flex justify-center items-center gap-12 py-4">
        <app-vertical-slider 
          [value]="dataService.leftSliderValue()" 
          [min]="0" 
          [max]="2500"
          [step]="500"
          (valueChange)="dataService.setLeftSlider($event)"
        />
        <div class="w-px h-[140px] bg-gray-200"></div>
        <app-vertical-slider 
          [value]="dataService.rightSliderValue()" 
          [min]="0" 
          [max]="2500"
          [step]="500"
          (valueChange)="dataService.setRightSlider($event)"
        />
      </div>
    </ion-card-content>
  </ion-card>

  <ion-button 
    expand="block" 
    class="h-[52px] font-semibold text-sm tracking-wide rounded-2xl"
    [class.pressed]="ctaPressed()"
    (pointerdown)="ctaPressed.set(true)"
    (pointerup)="onCtaClick(); ctaPressed.set(false)"
    (pointerleave)="ctaPressed.set(false)"
  >
    LOREM IPSUM
  </ion-button>
</ion-content>
