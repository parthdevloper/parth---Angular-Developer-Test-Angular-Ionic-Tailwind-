<ion-content>
  <div class="page">
    <div class="cols">
      <div
        class="mb-76 flex flex-col items-center text-center desk:mb-0 desk:items-start desk:text-left"
        [@fadeIn]="loaded()"
      >
        <div
          class="mb-30 flex h-140 w-140 items-center justify-center rounded-46 grad-panel glow-logo desk:mb-40 desk:h-160 desk:w-160 desk:rounded-52"
        >
          <svg class="block h-74 w-74 text-white desk:h-86 desk:w-86" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" />
            <path d="M2 17L12 22L22 17" />
            <path d="M2 12L12 17L22 12" />
          </svg>
        </div>
        <h1 class="m-0 text-52 leading-normal font-extrabold text-ink desk:text-72">Finance</h1>
        <p class="mt-6 mb-0 text-26 text-muted desk:mt-12 desk:text-30">Track your money</p>
      </div>

      <form class="flex flex-col" (ngSubmit)="submit()" [@fadeIn]="loaded()">
        <span class="hidden text-34 font-extrabold text-ink desk:mb-26 desk:block">Sign in</span>

        <div class="field">
          <svg class="block h-32 w-32 flex-none text-brand" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 3.6-6 8-6s8 2 8 6" />
          </svg>
          <input
            class="input-bare flex-auto text-26 font-extrabold text-ink placeholder:text-muted placeholder:opacity-65 disabled:opacity-60"
            type="text"
            name="username"
            placeholder="Username"
            aria-label="Username"
            autocomplete="username"
            [(ngModel)]="username"
            [disabled]="auth.loading()"
          />
        </div>

        <div class="field mt-28">
          <svg class="block h-32 w-32 flex-none text-brand" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="10.5" width="16" height="10.5" rx="2.5" />
            <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5" />
          </svg>
          <input
            class="input-bare flex-auto text-26 font-extrabold text-ink placeholder:text-muted placeholder:opacity-65 disabled:opacity-60"
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            placeholder="Password"
            aria-label="Password"
            autocomplete="current-password"
            [(ngModel)]="password"
            [disabled]="auth.loading()"
          />
          <button
            type="button"
            class="eye-toggle -mr-8 flex h-52 w-52 flex-none items-center justify-center rounded-full text-muted opacity-70 hover:opacity-100"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            (click)="showPassword.set(!showPassword())"
          >
            <svg class="block h-30 w-30" viewBox="0 0 24 24" aria-hidden="true">
              @if (showPassword()) {
                <path d="M3 3l18 18" />
                <path d="M10.7 6.2A10 10 0 0 1 12 6c6.4 0 10 6 10 6a17.4 17.4 0 0 1-3.3 3.8" />
                <path d="M6.6 8.3A17.2 17.2 0 0 0 2 12s3.6 6 10 6a10 10 0 0 0 3.3-.5" />
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
              } @else {
                <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z" />
                <circle cx="12" cy="12" r="3" />
              }
            </svg>
          </button>
        </div>

        @if (auth.error()) {
          <p
            class="mt-24 mb-0 rounded-16 bg-alert px-26 py-18 text-center text-22 font-bold text-danger shadow-alert"
            role="alert"
          >
            {{ auth.error() }}
          </p>
        }

        <button type="submit" class="btn-cta submit mt-44 uppercase" [disabled]="auth.loading() || !username || !password">
          @if (auth.loading()) {
            <ion-spinner name="crescent" class="h-38 w-38 text-white"></ion-spinner>
          } @else {
            Sign In
          }
        </button>

        <p class="mt-30 mb-0 text-center text-20 font-bold text-muted opacity-70 desk:pl-32 desk:text-left">
          Demo: oliviaw / oliviawpass
        </p>
      </form>
    </div>
  </div>
</ion-content>
