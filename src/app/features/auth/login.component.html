<ion-content class="[--background:var(--page-bg)]">
  <div
    class="box-border flex min-h-full flex-col justify-center pt-[env(safe-area-inset-top,0px)] pb-[env(safe-area-inset-bottom,0px)] shadow-[inset_0_2px_40px_1px_rgba(120,180,230,0.18)] desk:px-64"
  >
    <div
      class="mx-auto box-border w-[calc(var(--ux)*500)] max-w-full px-[calc(var(--ux)*30)] desk:grid desk:w-full desk:max-w-1180 desk:grid-cols-[minmax(0,auto)_minmax(0,calc(var(--u)*520))] desk:items-center desk:justify-center desk:gap-x-120 desk:px-0"
    >
      <div
        class="mb-76 flex flex-col items-center text-center desk:mb-0 desk:items-start desk:text-left"
        [@fadeIn]="loaded()"
      >
        <div
          class="mb-30 flex h-140 w-140 items-center justify-center rounded-[calc(var(--u)*46)] bg-[linear-gradient(150deg,#2aa6f6_0%,#1490f3_55%,#0b83f2_100%)] [filter:drop-shadow(0_calc(var(--u)*10)_calc(var(--u)*15)_rgba(26,140,240,0.38))] desk:mb-40 desk:h-160 desk:w-160 desk:rounded-[calc(var(--u)*52)]"
        >
          <svg
            class="block h-74 w-74 text-white desk:h-86 desk:w-86"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 2L2 7L12 12L22 7L12 2Z" />
            <path d="M2 17L12 22L22 17" />
            <path d="M2 12L12 17L22 12" />
          </svg>
        </div>
        <h1
          class="m-0 text-[length:calc(var(--u)*52)] leading-[normal] font-extrabold text-ink desk:text-[length:calc(var(--u)*72)]"
        >
          Finance
        </h1>
        <p
          class="mt-6 mb-0 text-[length:calc(var(--u)*26)] leading-[normal] font-normal text-muted desk:mt-12 desk:text-[length:calc(var(--u)*30)]"
        >
          Track your money
        </p>
      </div>

      <form class="flex flex-col" (ngSubmit)="handleLogin()" [@fadeIn]="loaded()">
        <span
          class="hidden text-[length:calc(var(--u)*34)] leading-[normal] font-extrabold text-ink desk:mb-26 desk:block"
        >
          Sign in
        </span>

        <div
          class="flex h-86 items-center gap-[calc(var(--ux)*20)] rounded-[calc(var(--u)*22)] bg-[rgba(255,255,255,0.88)] px-[calc(var(--ux)*32)] shadow-[0_calc(var(--u)*8)_calc(var(--u)*22)_rgba(120,180,230,0.18)] [transition:box-shadow_0.18s_ease] focus-within:shadow-[0_calc(var(--u)*8)_calc(var(--u)*22)_rgba(90,160,230,0.28),inset_0_0_0_2px_var(--color-brand)]"
        >
          <svg
            class="block h-32 w-32 flex-none text-brand"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 3.6-6 8-6s8 2 8 6" />
          </svg>
          <input
            class="min-w-0 flex-auto border-0 bg-transparent p-0 font-control text-[length:calc(var(--u)*26)] leading-[normal] font-extrabold text-ink outline-none placeholder:text-muted placeholder:opacity-65 disabled:opacity-60 [&:-webkit-autofill]:[-webkit-text-fill-color:var(--color-ink)] [&:-webkit-autofill]:[transition:background-color_6000000s]"
            type="text"
            name="username"
            placeholder="Username"
            aria-label="Username"
            autocomplete="username"
            [(ngModel)]="username"
            [disabled]="authService.loading()"
          />
        </div>

        <div
          class="mt-28 flex h-86 items-center gap-[calc(var(--ux)*20)] rounded-[calc(var(--u)*22)] bg-[rgba(255,255,255,0.88)] px-[calc(var(--ux)*32)] shadow-[0_calc(var(--u)*8)_calc(var(--u)*22)_rgba(120,180,230,0.18)] [transition:box-shadow_0.18s_ease] focus-within:shadow-[0_calc(var(--u)*8)_calc(var(--u)*22)_rgba(90,160,230,0.28),inset_0_0_0_2px_var(--color-brand)]"
        >
          <svg
            class="block h-32 w-32 flex-none text-brand"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="4" y="10.5" width="16" height="10.5" rx="2.5" />
            <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5" />
          </svg>
          <input
            class="min-w-0 flex-auto border-0 bg-transparent p-0 font-control text-[length:calc(var(--u)*26)] leading-[normal] font-extrabold text-ink outline-none placeholder:text-muted placeholder:opacity-65 disabled:opacity-60 [&:-webkit-autofill]:[-webkit-text-fill-color:var(--color-ink)] [&:-webkit-autofill]:[transition:background-color_6000000s]"
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            placeholder="Password"
            aria-label="Password"
            autocomplete="current-password"
            [(ngModel)]="password"
            [disabled]="authService.loading()"
          />
          <button
            type="button"
            class="m-0 flex h-52 w-52 flex-none appearance-none items-center justify-center mr-[calc(var(--ux)*-8)] cursor-pointer rounded-full border-0 bg-transparent p-0 font-control text-muted opacity-70 [transition:opacity_0.18s_ease,transform_0.15s_ease] hover:opacity-100 active:[transform:scale(0.9)]"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            (click)="showPassword.set(!showPassword())"
          >
            <svg
              class="block h-30 w-30"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              @if (showPassword()) {
                <path d="M3 3l18 18" />
                <path d="M10.7 6.2A10 10 0 0 1 12 6c6.4 0 10 6 10 6a17.4 17.4 0 0 1-3.3 3.8" />
                <path d="M6.6 8.3A17.2 17.2 0 0 0 2 12s3.6 6 10 6a10 10 0 0 0 3.3-.5" />
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
              } @else {
                <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z" />
                <circle cx="12" cy="12" r="3" />
              }
            </svg>
          </button>
        </div>

        @if (authService.error()) {
          <p
            class="mt-24 mb-0 rounded-[calc(var(--u)*16)] bg-[rgba(255,255,255,0.72)] px-[calc(var(--ux)*26)] py-18 text-center text-[length:calc(var(--u)*22)] leading-[normal] font-bold text-[#d6455d] shadow-[0_calc(var(--u)*6)_calc(var(--u)*16)_rgba(214,69,93,0.16)]"
            role="alert"
          >
            {{ authService.error() }}
          </p>
        }

        <button
          type="submit"
          class="mt-44 mb-0 flex h-89 cursor-pointer appearance-none items-center justify-center rounded-[calc(var(--u)*45)] border-0 bg-transparent bg-[linear-gradient(100deg,#2aa6f6_0%,#1490f3_55%,#0b83f2_100%)] p-0 font-control text-[length:calc(var(--u)*29)] leading-[normal] font-extrabold tracking-[0.5px] text-white uppercase [filter:drop-shadow(0_calc(var(--u)*10)_calc(var(--u)*13)_rgba(26,140,240,0.38))] [transition:transform_0.18s_ease,filter_0.18s_ease] enabled:active:[transform:scale(0.97)] disabled:cursor-default disabled:bg-[linear-gradient(100deg,#a6d2f4_0%,#9acbf2_55%,#90c5f1_100%)] disabled:[filter:none]"
          [disabled]="authService.loading() || !username || !password"
        >
          @if (authService.loading()) {
            <ion-spinner name="crescent" class="h-38 w-38 text-white"></ion-spinner>
          } @else {
            Sign In
          }
        </button>

        <p
          class="mt-30 mb-0 text-center text-[length:calc(var(--u)*20)] leading-[normal] font-bold text-muted opacity-70 desk:pl-[calc(var(--ux)*32)] desk:text-left"
        >
          Demo: oliviaw / oliviawpass
        </p>
      </form>
    </div>
  </div>
</ion-content>
