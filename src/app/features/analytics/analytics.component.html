<ion-content [scrollY]="true">
  <div class="page-shell">
    <div class="page-col">
      <div class="page-hdr justify-between desk:mb-64">
        <button type="button" class="icon-btn" aria-label="Back" (click)="goBack()">
          <img src="assets/icons/chevron-left.svg" alt="" class="block h-42 w-26" />
        </button>

        <button type="button" class="icon-btn" aria-label="Settings">
          <img src="assets/icons/gear.svg" alt="" class="block h-46 w-46" />
        </button>
      </div>

      <div class="page-body">
        <span
          class="mt-16 flex-none text-center text-47 font-extrabold whitespace-nowrap text-ink desk:col-start-1 desk:row-start-1 desk:mt-0 desk:text-left desk:text-64"
          [appCountUp]="dataService.analyticsData().total"
          countUpPrefix="$"
        ></span>
        <span
          class="flex-none text-center text-23 whitespace-nowrap text-ink-soft desk:col-start-1 desk:row-start-2 desk:text-left"
          >Lorem ipsum dolot</span
        >

        <div class="spacer" style="--spacer-min: 16; --spacer-max: 52"></div>

        <div
          class="relative mx-auto h-328 w-328 flex-none desk:col-start-2 desk:row-start-1 desk:row-span-6 desk:mx-0 desk:h-400 desk:w-400 desk:justify-self-center"
          [@fadeIn]="loaded()"
        >
          <div class="absolute inset-0 rounded-full bg-veil"></div>

          <svg class="donut-ring absolute" viewBox="0 0 252 252" aria-hidden="true">
            <defs>
              <linearGradient id="donut-blue" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#2aa6f6" />
                <stop offset="1" stop-color="#0b83f2" />
              </linearGradient>
            </defs>
            @for (seg of segments(); track seg.label) {
              <circle
                class="arc"
                cx="126"
                cy="126"
                fill="none"
                stroke-linecap="butt"
                stroke-width="48"
                [attr.r]="ringRadius"
                [attr.stroke]="seg.paint"
                [attr.stroke-dasharray]="
                  loaded() ? seg.dash + ' ' + (ringLength - seg.dash) : '0 ' + ringLength
                "
                [attr.stroke-dashoffset]="-seg.offset"
              />
            }
          </svg>

          <div class="donut-hole absolute rounded-full bg-sky"></div>
        </div>

        <div class="spacer" style="--spacer-min: 12; --spacer-max: 39"></div>

        <span
          class="flex-none text-center text-23 whitespace-nowrap text-ink-soft desk:col-start-1 desk:row-start-3 desk:mt-52 desk:text-left"
          >Lorem ipsum dolot</span
        >
        <span
          class="mt-21 flex-none text-center text-36 whitespace-nowrap desk:col-start-1 desk:row-start-4 desk:mt-10 desk:text-left"
        >
          <span class="font-extrabold text-ink" [appCountUp]="selected().value" countUpPrefix="$"></span>
          <span class="text-26 font-bold text-muted-blue">&nbsp;/ {{ selected().share }}%</span>
        </span>

        <div
          class="mt-19 flex flex-none items-center justify-center gap-13 desk:col-start-1 desk:row-start-5 desk:mt-28 desk:justify-start"
        >
          @for (seg of segments(); track seg.label; let i = $index) {
            <button
              type="button"
              class="dot relative h-11 w-11 rounded-full"
              [class]="i === selectedIndex() ? 'bg-white' : 'bg-brand'"
              [attr.aria-label]="seg.label"
              [attr.aria-current]="i === selectedIndex()"
              (click)="select(i)"
            ></button>
          }
        </div>

        <div class="spacer" style="--spacer-min: 16; --spacer-max: 55"></div>

        <div
          class="relative mx-auto flex h-68 w-438 flex-none rounded-34 grad-btn glow-pill desk:col-start-1 desk:row-start-6 desk:mx-0 desk:mt-48"
          [@fadeIn]="loaded()"
        >
          <span
            class="pill absolute top-6 h-56 rounded-28 bg-white shadow-pill"
            [style.--pill-left]="highlight().x"
            [style.--pill-width]="highlight().w"
          ></span>
          @for (item of dataService.analyticsData().breakdown; track item.label; let i = $index) {
            <button
              type="button"
              class="tab relative h-full flex-none text-23 font-extrabold uppercase"
              [class]="i === selectedIndex() ? 'text-ink' : 'text-white'"
              [style.--tab-width]="tabWidth(i)"
              (click)="select(i)"
            >
              {{ item.label }}
            </button>
          }
        </div>
      </div>
    </div>
  </div>
</ion-content>
