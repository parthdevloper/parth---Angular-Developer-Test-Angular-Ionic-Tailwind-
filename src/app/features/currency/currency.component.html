<ion-content [scrollY]="true">
  <div class="page-shell">
    <div class="page-col">
      <div class="page-hdr gap-18 desk:mb-56 desk:gap-26">
        <div
          class="relative h-84 w-84 flex-none overflow-hidden rounded-full bg-white shadow-avatar"
        >
          <span class="absolute top-16 left-26 h-32 w-32 rounded-16 bg-brand"></span>
          <span class="absolute top-54 left-14 h-44 w-56 rounded-t-28 bg-brand"></span>
        </div>

        <div class="flex min-w-0 flex-col desk:gap-6">
          <span class="text-27 font-extrabold whitespace-nowrap text-ink">{{ userName }}</span>
          <span class="text-18 font-bold whitespace-nowrap text-ink">{{ userHandle }}</span>
        </div>

        <button type="button" class="icon-btn ml-auto flex-none gap-8" aria-label="More options" disabled>
          <span class="h-12 w-12 rounded-6 bg-brand"></span>
          <span class="h-12 w-12 rounded-6 bg-brand"></span>
          <span class="h-12 w-12 rounded-6 bg-brand"></span>
        </button>
      </div>

      <div class="page-body">
        <div class="spacer" style="--spacer-max: 68"></div>

        <div
          class="card flex h-86 flex-none items-center rounded-22 pl-32 desk:col-start-1 desk:row-start-1"
          [@fadeIn]="loaded()"
        >
          <input
            class="input-bare w-full text-26 font-extrabold text-ink placeholder:text-ink placeholder:opacity-100"
            type="text"
            placeholder="Lorem ipsum"
            aria-label="Search"
          />
        </div>

        <div class="spacer" style="--spacer-max: 47"></div>

        <div class="grid flex-none grid-cols-2 gap-x-44 desk:col-start-1 desk:row-start-2 desk:gap-34">
          <button
            type="button"
            class="card-btn h-123 flex-col items-center justify-center gap-8 rounded-20 text-center"
            [@fadeIn]="loaded()"
            (click)="showRates('left')"
          >
            <span class="text-34 font-extrabold whitespace-nowrap text-ink"
              >${{ dataService.leftSliderValue() }}</span
            >
            <span class="text-17 whitespace-nowrap text-muted">Lorem ipsum dolor</span>
          </button>
          <button
            type="button"
            class="card-btn h-123 flex-col items-center justify-center gap-8 rounded-20 text-center"
            [@fadeIn]="loaded()"
            (click)="showRates('right')"
          >
            <span class="text-34 font-extrabold whitespace-nowrap text-ink"
              >${{ dataService.rightSliderValue() }}</span
            >
            <span class="text-17 whitespace-nowrap text-muted">Lorem ipsum dolor</span>
          </button>
        </div>

        <div class="spacer" style="--spacer-max: 55"></div>

        <div
          class="grid flex-none grid-cols-2 items-start justify-items-center gap-x-44 desk:col-start-2 desk:row-start-1 desk:row-span-3 desk:gap-40"
        >
          @for (slider of sliders; track slider.label) {
            <div class="flex items-start gap-27 desk:gap-30">
              <app-vertical-slider
                class="flex-none"
                [label]="slider.label"
                [min]="sliderMin"
                [max]="sliderMax"
                [step]="sliderStep"
                [value]="slider.value()"
                (valueChange)="slider.value.set($event)"
              />
              <div class="flex flex-none flex-col gap-36 pt-17">
                @for (tick of ticks; track tick) {
                  <div class="flex h-26 items-center gap-20">
                    <span class="h-3 w-26 flex-none bg-brand"></span>
                    <span class="text-26 font-bold whitespace-nowrap text-ink">{{ tick }}</span>
                  </div>
                }
              </div>
            </div>
          }
        </div>

        <div class="spacer" style="--spacer-max: 55"></div>

        <div class="mb-10 flex flex-none justify-center desk:col-start-1 desk:row-start-3 desk:mb-0">
          <button type="button" class="btn-cta w-297 desk:w-full desk:max-w-420" (click)="openAnalytics()">
            LOREM IPSUM
          </button>
        </div>
      </div>
    </div>
  </div>
</ion-content>
